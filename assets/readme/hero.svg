<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600">
  <!-- README banner: the porter carries sessions from an account at its limit to one with room. -->
  <defs>
    <symbol id="i-check" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 8.4 L6.4 11.8 L13 4.6"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M6.6 2.3 Q8 0.1 9.4 2.3 L15.1 12.4 Q16.3 14.6 13.8 14.6 H2.2 Q-0.3 14.6 0.9 12.4 Z M7.15 5.2 H8.85 L8.55 10.1 H7.45 Z M8 11 A1.05 1.05 0 1 0 8 13.1 A1.05 1.05 0 1 0 8 11 Z"/></symbol>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2522"/>
      <stop offset="1" stop-color="#171413"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.62" r="0.45">
      <stop offset="0" stop-color="#E88F66" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#E88F66" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <!-- Porter app icon (assets/brand/porter-app-icon.svg), ids prefixed -->
    <linearGradient id="p-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8906A"/><stop offset="1" stop-color="#C85E3B"/></linearGradient>
    <linearGradient id="p-uni" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#433053"/><stop offset="1" stop-color="#2F2039"/></linearGradient>
    <linearGradient id="p-cap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4E3560"/><stop offset="1" stop-color="#382643"/></linearGradient>
    <linearGradient id="p-edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0.45"/><stop offset="0.5" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="p-sq"><rect x="16" y="16" width="224" height="224" rx="52"/></clipPath>
    <g id="porter">
      <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#p-bg)"/>
      <g clip-path="url(#p-sq)">
        <path d="M40 256 V224 Q40 188 82 181 L111 177 H145 L174 181 Q216 188 216 224 V256 Z" fill="url(#p-uni)"/>
        <path d="M111 177 L128 212 L145 177 Z" fill="#FFF4EA"/>
        <path d="M111 177 L96 183 L119 226 L128 212 Z" fill="#57406B"/>
        <path d="M145 177 L160 183 L137 226 L128 212 Z" fill="#57406B"/>
        <circle cx="128" cy="238" r="4.5" fill="#E8B866"/>
      </g>
      <path d="M115 148 H141 V172 Q141 180 128 182 Q115 180 115 172 Z" fill="#F2D3C0"/>
      <path d="M115 152 H141 V162 Q128 170 115 162 Z" fill="#E2B9A3"/>
      <circle cx="128" cy="126" r="33" fill="#FFF4EA"/>
      <g transform="rotate(-8 128 98)">
        <path d="M102 84 Q102 72 114 72 H142 Q154 72 154 84 L157 104 H99 Z" fill="url(#p-cap)"/>
        <path d="M106 80 Q107 76 112 76 H128" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="3" stroke-linecap="round"/>
        <rect x="100" y="92" width="56" height="5" rx="2.5" fill="#E8B866"/>
        <rect x="93" y="101" width="70" height="10" rx="5" fill="#2A1C33"/>
      </g>
      <circle cx="167" cy="208" r="14.5" fill="#E8B866"/>
      <circle cx="167" cy="208" r="12" fill="#FFF4EA"/>
      <g stroke="#D97757" stroke-width="3.4" stroke-linecap="round"><line x1="167" y1="208" x2="167" y2="200.5"/><line x1="167" y1="208" x2="173.5" y2="204.25"/><line x1="167" y1="208" x2="173.5" y2="211.75"/><line x1="167" y1="208" x2="167" y2="215.5"/><line x1="167" y1="208" x2="160.5" y2="211.75"/><line x1="167" y1="208" x2="160.5" y2="204.25"/></g>
      <rect x="17" y="17" width="222" height="222" rx="51" fill="none" stroke="url(#p-edge)" stroke-width="2"/>
    </g>
    <path id="arc" d="M 430 392 C 530 262, 750 262, 850 392"/>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: "New York", ui-serif, "Iowan Old Style", Georgia, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .bob { animation: bob 3s ease-in-out infinite; transform-origin: 640px 400px; }
      @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      .trail { stroke-dasharray: 6 10; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -32; } }
      .arrive { animation: arrive 4s ease-out infinite; }
      @keyframes arrive { 0%, 70% { opacity: 0.35; } 85%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1280" height="600" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="600" rx="28" fill="url(#glow)"/>

  <text x="640" y="92" text-anchor="middle" class="serif" font-size="64" font-weight="600" fill="#F7F1EA" letter-spacing="-1">Porter</text>
  <text x="640" y="126" text-anchor="middle" font-size="18" font-weight="500" fill="#C9A894" letter-spacing="3">FOR CLAUDE DESKTOP</text>
  <text x="640" y="170" text-anchor="middle" font-size="21" fill="#BFB3A8">Hit the limit on one account? Carry your Claude Code sessions to another.</text>

  <!-- Source account: out of usage -->
  <g filter="url(#shadow)"><rect x="96" y="232" width="336" height="300" rx="20" fill="#332C28" stroke="#4A3F39"/></g>
  <text x="124" y="274" class="serif" font-size="23" font-weight="600" fill="#F7F1EA">Work</text>
  <text x="124" y="300" font-size="14" fill="#9C8F84">alex@company.example</text>
  <text x="124" y="336" font-size="13" fill="#BFB3A8">5h</text>
  <rect x="156" y="326" width="206" height="10" rx="5" fill="#E5534B"/>
  <text x="374" y="336" font-size="13" font-weight="600" fill="#F28B82">100%</text>
  <text x="124" y="360" font-size="13" fill="#BFB3A8">7d</text>
  <rect x="156" y="350" width="206" height="10" rx="5" fill="#4A3F39"/>
  <rect x="156" y="350" width="190" height="10" rx="5" fill="#E89A4E"/>
  <text x="374" y="360" font-size="13" font-weight="600" fill="#F0B27A">92%</text>
  <g class="pulse">
    <rect x="124" y="382" width="280" height="32" rx="9" fill="#4A2622" stroke="#7A3A33"/>
    <use href="#i-warn" x="140.0" y="390.0" width="14" height="14" color="#F28B82"/><text x="162.0" y="403" font-size="14" fill="#F28B82">6 stopped by the usage limit</text>
  </g>
  <g opacity="0.45">
    <rect x="124" y="426" width="280" height="34" rx="9" fill="#3D3530"/>
    <circle cx="142" cy="443" r="5" fill="#9C8F84"/>
    <text x="156" y="448" class="mono" font-size="13" fill="#BFB3A8">refactor-checkout</text>
    <rect x="124" y="468" width="280" height="34" rx="9" fill="#3D3530"/>
    <circle cx="142" cy="485" r="5" fill="#9C8F84"/>
    <text x="156" y="490" class="mono" font-size="13" fill="#BFB3A8">fix-flaky-tests</text>
  </g>

  <!-- Destination account: plenty left -->
  <g filter="url(#shadow)"><rect x="848" y="232" width="336" height="300" rx="20" fill="#332C28" stroke="#4A3F39"/></g>
  <text x="876" y="274" class="serif" font-size="23" font-weight="600" fill="#F7F1EA">Personal</text>
  <text x="876" y="300" font-size="14" fill="#9C8F84">alex@home.example</text>
  <text x="876" y="336" font-size="13" fill="#BFB3A8">5h</text>
  <rect x="908" y="326" width="206" height="10" rx="5" fill="#4A3F39"/>
  <rect x="908" y="326" width="17" height="10" rx="5" fill="#5CB176"/>
  <text x="1126" y="336" font-size="13" font-weight="600" fill="#8FD19E">8%</text>
  <text x="876" y="360" font-size="13" fill="#BFB3A8">7d</text>
  <rect x="908" y="350" width="206" height="10" rx="5" fill="#4A3F39"/>
  <rect x="908" y="350" width="43" height="10" rx="5" fill="#5CB176"/>
  <text x="1126" y="360" font-size="13" font-weight="600" fill="#8FD19E">21%</text>
  <rect x="876" y="382" width="280" height="32" rx="9" fill="#1F3A28" stroke="#2F5A3C"/>
  <use href="#i-check" x="892.0" y="390.0" width="14" height="14" color="#8FD19E"/><text x="914.0" y="403" font-size="14" fill="#8FD19E">Ready to continue</text>
  <g class="arrive">
    <rect x="876" y="426" width="280" height="34" rx="9" fill="#3D3530"/>
    <circle cx="894" cy="443" r="5" fill="#E88F66"/>
    <text x="908" y="448" class="mono" font-size="13" fill="#F7F1EA">refactor-checkout</text>
    <rect x="876" y="468" width="280" height="34" rx="9" fill="#3D3530"/>
    <circle cx="894" cy="485" r="5" fill="#E88F66"/>
    <text x="908" y="490" class="mono" font-size="13" fill="#F7F1EA">fix-flaky-tests</text>
  </g>

  <!-- The way sessions travel -->
  <use href="#arc" fill="none" stroke="#E88F66" stroke-opacity="0.5" stroke-width="2.5" stroke-linecap="round" class="trail"/>
  <g>
    <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#E88F66"/>
    <text x="0" y="5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#2B2522">refactor-checkout</text>
    <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#arc"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <rect x="-64" y="-14" width="128" height="28" rx="14" fill="#F2B596"/>
    <text x="0" y="5" text-anchor="middle" class="mono" font-size="12" font-weight="600" fill="#2B2522">fix-flaky-tests</text>
    <animateMotion dur="4s" begin="2s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines="0.45 0 0.55 1"><mpath href="#arc"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="4s" begin="2s" repeatCount="indefinite"/>
  </g>

  <!-- The porter in the middle -->
  <g class="bob">
    <g filter="url(#shadow)">
      <use href="#porter" transform="translate(568 330) scale(0.5625)"/>
    </g>
  </g>
  <text x="640" y="540" text-anchor="middle" font-size="14" fill="#9C8F84">macOS menu-bar app · free and open source</text>
</svg>
