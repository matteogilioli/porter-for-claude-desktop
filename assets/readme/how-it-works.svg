<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470">
  <!-- What Porter moves: the small session file that tells Claude Desktop which account lists a
       session. The conversation itself stays in ~/.claude/projects, shared by every account. -->
  <defs>
    <symbol id="i-doc" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"><path d="M3.5 1.5 H9.5 L12.5 4.5 V14.5 H3.5 Z M9.5 1.5 V4.5 H12.5"/><path d="M5.6 8 H10.4 M5.6 10.6 H10.4" stroke-linecap="round"/></g></symbol>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C96442"/>
    </marker>
    <path id="hop" d="M 330 150 C 450 80, 650 80, 770 150"/>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: "New York", ui-serif, "Iowan Old Style", Georgia, serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .dash { stroke-dasharray: 5 7; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -24; } }
      .landed { animation: landed 5s infinite; } @keyframes landed { 0%, 60% { opacity: 0; } 72%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .landed { opacity: 1; } }
    </style>
  </defs>

  <rect width="1100" height="470" rx="22" fill="#F5F0E8"/>

  <!-- Source account -->
  <rect x="40" y="40" width="300" height="200" rx="14" fill="#FFFDF9" stroke="#E7DDD1"/>
  <text x="62" y="72" class="serif" font-size="18" font-weight="600" fill="#2B2522">Work account</text>
  <text x="62" y="94" font-size="12" fill="#857A70">Claude Desktop · session list</text>
  <rect x="62" y="112" width="256" height="32" rx="8" fill="#F5F0E8" stroke="#E7DDD1"/>
  <use href="#i-doc" x="74.0" y="120.0" width="15" height="15" color="#857A70"/><text x="96.0" y="133" class="mono" font-size="12" fill="#2B2522">local_7f3a….json</text>
  <rect x="62" y="152" width="256" height="32" rx="8" fill="#F5F0E8" stroke="#E7DDD1"/>
  <use href="#i-doc" x="74.0" y="160.0" width="15" height="15" color="#B0A498"/><text x="96.0" y="173" class="mono" font-size="12" fill="#857A70">local_c21e….json</text>
  <text x="62" y="214" font-size="11" fill="#B0A498">title · folder · conversation id · archived?</text>

  <!-- Destination account -->
  <rect x="760" y="40" width="300" height="200" rx="14" fill="#FFFDF9" stroke="#E7DDD1"/>
  <text x="782" y="72" class="serif" font-size="18" font-weight="600" fill="#2B2522">Personal account</text>
  <text x="782" y="94" font-size="12" fill="#857A70">Claude Desktop · session list</text>
  <g class="landed">
    <rect x="782" y="112" width="256" height="32" rx="8" fill="#F6E4DA" stroke="#C96442"/>
    <use href="#i-doc" x="794.0" y="120.0" width="15" height="15" color="#C96442"/><text x="816.0" y="133" class="mono" font-size="12" fill="#2B2522">local_7f3a….json</text>
  </g>
  <text x="782" y="214" font-size="11" fill="#B0A498">a copy, with the limit error cleared</text>

  <!-- The hop -->
  <use href="#hop" fill="none" stroke="#C96442" stroke-width="2" class="dash" marker-end="url(#arrow)"/>
  <g>
    <rect x="-46" y="-13" width="92" height="26" rx="13" fill="#C96442"/>
    <text x="0" y="5" text-anchor="middle" class="mono" font-size="11" font-weight="700" fill="#FFFFFF">local_7f3a</text>
    <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.1;0.65;1" calcMode="linear"><mpath href="#hop"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.1;0.6;0.68;1" dur="5s" repeatCount="indefinite"/>
  </g>
  <text x="550" y="70" font-size="13" font-weight="700" fill="#C96442" text-anchor="middle">Porter</text>
  <text x="550" y="88" font-size="11" fill="#857A70" text-anchor="middle">backup first · restart the app if needed</text>

  <!-- Shared conversations -->
  <rect x="330" y="320" width="440" height="110" rx="14" fill="#2B2522"/>
  <text x="352" y="352" class="serif" font-size="17" font-weight="600" fill="#F5F0E8">~/.claude/projects</text>
  <text x="352" y="374" font-size="12" fill="#C9BDB1">The conversations themselves, shared by every account.</text>
  <text x="352" y="396" class="mono" font-size="12" fill="#E8B866">9114d689….jsonl</text>
  <text x="352" y="416" font-size="11" fill="#9C8F84">untouched by a move · duplicated by Copy</text>

  <path d="M190 240 C 190 290, 360 290, 420 320" fill="none" stroke="#B0A498" stroke-width="1.6" class="dash"/>
  <path d="M910 240 C 910 290, 740 290, 680 320" fill="none" stroke="#B0A498" stroke-width="1.6" class="dash"/>

  <!-- Not local -->
  <rect x="40" y="320" width="250" height="110" rx="14" fill="none" stroke="#D9CCBE" stroke-dasharray="4 5"/>
  <text x="60" y="350" font-size="13" font-weight="700" fill="#857A70">Chats</text>
  <text x="60" y="372" font-size="12" fill="#857A70">Stored on Anthropic's servers,</text>
  <text x="60" y="390" font-size="12" fill="#857A70">tied to the account:</text>
  <text x="60" y="408" font-size="12" fill="#857A70">Porter does not touch them.</text>
</svg>
