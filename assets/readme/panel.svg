<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760">
  <!-- The menu-bar panel, with made-up accounts. Mirrors StatusPanel.swift. -->
  <defs>
    <symbol id="i-arrow" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M2.5 8 H13 M8.8 3.8 L13 8 L8.8 12.2"/></symbol>
    <symbol id="i-chev-r" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 3.2 L10.8 8 L6 12.8"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="8" cy="8" r="6.3"/><path d="M8 4.4 V8 L10.6 9.6"/></g></symbol>
    <symbol id="i-dots" viewBox="0 0 16 16"><g fill="currentColor"><circle cx="2.6" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="13.4" cy="8" r="1.5"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 2.5 V13.5 M2.5 8 H13.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M6.6 2.3 Q8 0.1 9.4 2.3 L15.1 12.4 Q16.3 14.6 13.8 14.6 H2.2 Q-0.3 14.6 0.9 12.4 Z M7.15 5.2 H8.85 L8.55 10.1 H7.45 Z M8 11 A1.05 1.05 0 1 0 8 13.1 A1.05 1.05 0 1 0 8 11 Z"/></symbol>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D9A88C"/>
      <stop offset="0.55" stop-color="#B9876F"/>
      <stop offset="1" stop-color="#7E5A55"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2B1A12" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="p-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8906A"/><stop offset="1" stop-color="#C85E3B"/></linearGradient>
    <linearGradient id="p-uni" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#433053"/><stop offset="1" stop-color="#2F2039"/></linearGradient>
    <clipPath id="p-sq"><rect x="16" y="16" width="224" height="224" rx="52"/></clipPath>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: "New York", ui-serif, "Iowan Old Style", Georgia, serif; }
      .glow { animation: glow 2.6s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 0.55; } }
      .dot { animation: dot 2.6s ease-in-out infinite; }
      @keyframes dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <!-- Desktop and menu bar -->
  <rect width="640" height="760" rx="22" fill="url(#wall)"/>
  <rect width="640" height="30" rx="0" fill="#FFFFFF" fill-opacity="0.55"/>
  <text x="18" y="20" font-size="13" font-weight="700" fill="#2B2522"></text>
  <text x="560" y="20" font-size="12" fill="#2B2522" text-anchor="end">Tue 10:42</text>
  <!-- Porter menu-bar icon with the "stopped" dot -->
  <g transform="translate(470 6)" fill="#2B2522">
    <g transform="scale(0.1)" fill-rule="evenodd">
      <path d="M18 180 V158 Q18 132 52 127 L74 124 L90 150 L106 124 L128 127 Q162 132 162 158 V180 Z"/>
      <circle cx="90" cy="86" r="27"/>
      <g transform="rotate(-8 90 52)"><path d="M68 40 Q68 28 80 28 H100 Q112 28 112 40 L115 56 H65 Z"/><rect x="58" y="58" width="64" height="11" rx="5.5"/></g>
    </g>
    <circle class="dot" cx="15.2" cy="2.8" r="2.5"/>
  </g>
  <rect x="462" y="3" width="34" height="24" rx="6" fill="#2B2522" fill-opacity="0.12"/>

  <!-- Panel -->
  <g filter="url(#drop)">
    <rect x="130" y="40" width="380" height="696" rx="16" fill="#F5F0E8" stroke="#E7DDD1"/>
  </g>

  <!-- Header -->
  <g transform="translate(146 54) scale(0.14)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#p-bg)"/>
    <g clip-path="url(#p-sq)"><path d="M40 256 V224 Q40 188 82 181 L111 177 H145 L174 181 Q216 188 216 224 V256 Z" fill="url(#p-uni)"/><path d="M111 177 L128 212 L145 177 Z" fill="#FFF4EA"/></g>
    <circle cx="128" cy="126" r="33" fill="#FFF4EA"/>
    <g transform="rotate(-8 128 98)"><path d="M102 84 Q102 72 114 72 H142 Q154 72 154 84 L157 104 H99 Z" fill="#433053"/><rect x="100" y="92" width="56" height="5" rx="2.5" fill="#E8B866"/><rect x="93" y="101" width="70" height="10" rx="5" fill="#2A1C33"/></g>
  </g>
  <text x="190" y="72" class="serif" font-size="19" font-weight="600" fill="#2B2522">Porter</text>
  <text x="190" y="87" font-size="10" font-weight="500" fill="#857A70">for Claude Desktop</text>
  <g fill="none" stroke="#857A70" stroke-width="1.6" stroke-linecap="round">
    <path d="M430 66 a7 7 0 1 1 -2 -5 M428 57 v4 h-4"/>
    <rect x="450" y="60" width="16" height="12" rx="2.5"/><path d="M450 64 h16"/>
    <circle cx="489" cy="66" r="3"/><circle cx="489" cy="66" r="7.5" stroke-dasharray="3 2.2"/>
  </g>

  <text x="148" y="122" font-size="10" font-weight="700" letter-spacing="0.8" fill="#857A70">RUNNING</text>

  <!-- Card: Work (at its limit) -->
  <rect x="144" y="132" width="352" height="232" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
  <circle cx="164" cy="158" r="3.5" fill="#4F8A5B"/>
  <text x="176" y="164" class="serif" font-size="16" font-weight="600" fill="#2B2522">Work</text>
  <use href="#i-dots" x="462.0" y="150.0" width="16" height="16" color="#857A70"/>
  <text x="162" y="192" font-size="12" fill="#857A70">alex@company.example</text>
  <text x="162" y="217" font-size="10" fill="#857A70">5h</text>
  <rect x="184" y="210" width="246" height="5" rx="2.5" fill="#C2452D"/>
  <text x="478" y="217" font-size="10" font-weight="700" fill="#C2452D" text-anchor="end">100%</text>
  <text x="162" y="236" font-size="10" fill="#857A70">7d</text>
  <rect x="184" y="229" width="246" height="5" rx="2.5" fill="#EDE4D8"/>
  <rect x="184" y="229" width="226" height="5" rx="2.5" fill="#C2711F"/>
  <text x="478" y="236" font-size="10" font-weight="700" fill="#C2711F" text-anchor="end">92%</text>
  <text x="162" y="268" font-size="11" fill="#857A70">14 open</text>
  <rect x="210" y="255" width="146" height="20" rx="10" fill="#C2711F" fill-opacity="0.13"/>
  <use href="#i-warn" x="219.0" y="259.0" width="10" height="10" color="#C2711F"/><text x="233.0" y="269" font-size="11" font-weight="600" fill="#C2711F">6 stopped by limit</text>
  <text x="466.0" y="268" font-size="11" font-weight="700" fill="#C96442" text-anchor="end">Sessions</text><use href="#i-chev-r" x="468.0" y="260.0" width="9" height="9" color="#C96442"/>
  <rect class="glow" x="156" y="290" width="328" height="56" rx="12" fill="#C96442"/>
  <rect x="162" y="296" width="316" height="44" rx="9" fill="#C96442"/>
  <text x="312.0" y="323" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Move 6 to Personal</text><use href="#i-arrow" x="379.2" y="312.0" width="13" height="13" color="#FFFFFF"/>

  <!-- Card: Personal -->
  <rect x="144" y="376" width="352" height="160" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
  <circle cx="164" cy="402" r="3.5" fill="#4F8A5B"/>
  <text x="176" y="408" class="serif" font-size="16" font-weight="600" fill="#2B2522">Personal</text>
  <use href="#i-dots" x="462.0" y="394.0" width="16" height="16" color="#857A70"/>
  <text x="162" y="436" font-size="12" fill="#857A70">alex@home.example</text>
  <text x="162" y="461" font-size="10" fill="#857A70">5h</text>
  <rect x="184" y="454" width="246" height="5" rx="2.5" fill="#EDE4D8"/>
  <rect x="184" y="454" width="20" height="5" rx="2.5" fill="#4F8A5B"/>
  <text x="478" y="461" font-size="10" font-weight="700" fill="#4F8A5B" text-anchor="end">8%</text>
  <text x="162" y="480" font-size="10" fill="#857A70">7d</text>
  <rect x="184" y="473" width="246" height="5" rx="2.5" fill="#EDE4D8"/>
  <rect x="184" y="473" width="52" height="5" rx="2.5" fill="#4F8A5B"/>
  <text x="478" y="480" font-size="10" font-weight="700" fill="#4F8A5B" text-anchor="end">21%</text>
  <text x="162" y="512" font-size="11" fill="#857A70">32 open</text>
  <text x="466.0" y="512" font-size="11" font-weight="700" fill="#C96442" text-anchor="end">Sessions</text><use href="#i-chev-r" x="468.0" y="504.0" width="9" height="9" color="#C96442"/>

  <text x="148" y="566" font-size="10" font-weight="700" letter-spacing="0.8" fill="#857A70">CLOSED</text>

  <!-- Card: Side project (closed, stale usage) -->
  <rect x="144" y="576" width="352" height="106" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
  <circle cx="164" cy="602" r="3.5" fill="#B0A498"/>
  <text x="176" y="608" class="serif" font-size="16" font-weight="600" fill="#2B2522">Side project</text>
  <use href="#i-dots" x="462.0" y="594.0" width="16" height="16" color="#857A70"/>
  <text x="162" y="636" font-size="12" fill="#857A70">alex@studio.example</text>
  <g opacity="0.6">
    <text x="162" y="661" font-size="10" fill="#857A70">5h</text>
    <rect x="184" y="654" width="246" height="5" rx="2.5" fill="#EDE4D8"/>
    <text x="478" y="661" font-size="10" font-weight="700" fill="#857A70" text-anchor="end">reset</text>
    <use href="#i-clock" x="162.0" y="666.0" width="9" height="9" color="#B0A498"/><text x="174.0" y="674" font-size="9" fill="#B0A498">data from 2 days ago</text>
  </g>

  <!-- Footer -->
  <rect x="131" y="694" width="378" height="1" fill="#E7DDD1"/>
  <use href="#i-plus" x="148.0" y="710.0" width="11" height="11" color="#C96442"/><text x="164.0" y="720" font-size="12" font-weight="600" fill="#C96442">New Profile…</text>
</svg>
