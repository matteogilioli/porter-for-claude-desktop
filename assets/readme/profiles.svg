<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <!-- Several Claude Desktop apps side by side, one account each, all known to Porter. 8 s loop. -->
  <defs>
    <symbol id="i-plus" viewBox="0 0 16 16"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M8 2.5 V13.5 M2.5 8 H13.5"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path fill="currentColor" fill-rule="evenodd" d="M6.6 2.3 Q8 0.1 9.4 2.3 L15.1 12.4 Q16.3 14.6 13.8 14.6 H2.2 Q-0.3 14.6 0.9 12.4 Z M7.15 5.2 H8.85 L8.55 10.1 H7.45 Z M8 11 A1.05 1.05 0 1 0 8 13.1 A1.05 1.05 0 1 0 8 11 Z"/></symbol>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2F2A"/>
      <stop offset="1" stop-color="#1C1816"/>
    </linearGradient>
    <filter id="drop" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="p-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E8906A"/><stop offset="1" stop-color="#C85E3B"/></linearGradient>
    <linearGradient id="p-uni" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#433053"/><stop offset="1" stop-color="#2F2039"/></linearGradient>
    <clipPath id="p-sq"><rect x="16" y="16" width="224" height="224" rx="52"/></clipPath>
    <!-- A Claude Desktop window, drawn once and reused -->
    <g id="win">
      <rect width="300" height="330" rx="12" fill="#F7F4EE"/>
      <rect width="300" height="38" rx="12" fill="#ECE6DC"/><rect y="26" width="300" height="12" fill="#ECE6DC"/>
      <circle cx="18" cy="19" r="5.5" fill="#FF5F57"/><circle cx="36" cy="19" r="5.5" fill="#FEBC2E"/><circle cx="54" cy="19" r="5.5" fill="#28C840"/>
      <rect x="16" y="58" width="76" height="22" rx="11" fill="#E6DFD4"/>
      <rect x="98" y="58" width="76" height="22" rx="11" fill="#FFFFFF" stroke="#D9D0C3"/>
      <rect x="180" y="58" width="76" height="22" rx="11" fill="#E6DFD4"/>
      <rect x="16" y="100" width="268" height="14" rx="7" fill="#E6DFD4"/>
      <rect x="16" y="124" width="210" height="14" rx="7" fill="#E6DFD4"/>
      <rect x="16" y="160" width="268" height="54" rx="10" fill="#FFFFFF" stroke="#E2DACE"/>
      <rect x="28" y="174" width="180" height="10" rx="5" fill="#E6DFD4"/>
      <rect x="28" y="192" width="120" height="10" rx="5" fill="#EFE9E0"/>
      <rect x="16" y="226" width="268" height="54" rx="10" fill="#FFFFFF" stroke="#E2DACE"/>
      <rect x="28" y="240" width="150" height="10" rx="5" fill="#E6DFD4"/>
      <rect x="28" y="258" width="200" height="10" rx="5" fill="#EFE9E0"/>
      <rect x="16" y="292" width="268" height="24" rx="12" fill="#FFFFFF" stroke="#D9D0C3"/>
    </g>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: "New York", ui-serif, "Iowan Old Style", Georgia, serif; }
      .w1 { animation: w1 8s infinite; } @keyframes w1 { 0% { opacity: 0; transform: translateY(24px); } 6%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
      .w2 { animation: w2 8s infinite; } @keyframes w2 { 0%, 12% { opacity: 0; transform: translateY(24px); } 18%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
      .w3 { animation: w3 8s infinite; } @keyframes w3 { 0%, 24% { opacity: 0; transform: translateY(24px); } 30%, 92% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; } }
      .r1 { animation: r1 8s infinite; } @keyframes r1 { 0%, 4% { opacity: 0; } 8%, 92% { opacity: 1; } 100% { opacity: 0; } }
      .r2 { animation: r2 8s infinite; } @keyframes r2 { 0%, 16% { opacity: 0; } 20%, 92% { opacity: 1; } 100% { opacity: 0; } }
      .r3 { animation: r3 8s infinite; } @keyframes r3 { 0%, 28% { opacity: 0; } 32%, 92% { opacity: 1; } 100% { opacity: 0; } }
      .beat { animation: beat 1.6s ease-in-out infinite; } @keyframes beat { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
  </defs>

  <rect width="1200" height="620" rx="24" fill="url(#wall)"/>
  <rect width="1200" height="30" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="1170" y="20" font-size="12" fill="#E8DED3" text-anchor="end">Tue 10:42</text>
  <g transform="translate(1046 6)" fill="#F2EBE3">
    <g transform="scale(0.1)" fill-rule="evenodd">
      <path d="M18 180 V158 Q18 132 52 127 L74 124 L90 150 L106 124 L128 127 Q162 132 162 158 V180 Z"/>
      <circle cx="90" cy="86" r="27"/>
      <g transform="rotate(-8 90 52)"><path d="M68 40 Q68 28 80 28 H100 Q112 28 112 40 L115 56 H65 Z"/><rect x="58" y="58" width="64" height="11" rx="5.5"/></g>
    </g>
  </g>

  <!-- Three Claude Desktop apps, one account each -->
  <g class="w1"><g transform="translate(40 120)" filter="url(#drop)"><use href="#win"/></g>
    <text x="190" y="144" font-size="12" font-weight="600" fill="#5C534B" text-anchor="middle">Claude — Work</text>
    <circle cx="66" cy="490" r="0"/>
    <rect x="56" y="452" width="268" height="30" rx="15" fill="#2B2522"/>
    <circle cx="74" cy="467" r="9" fill="#C96442"/><text x="74" y="471" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">W</text>
    <text x="90" y="471" font-size="11" fill="#F5F0E8">alex@company.example</text>
  </g>
  <g class="w2"><g transform="translate(250 160)" filter="url(#drop)"><use href="#win"/></g>
    <text x="400" y="184" font-size="12" font-weight="600" fill="#5C534B" text-anchor="middle">Claude — Personal</text>
    <rect x="266" y="492" width="268" height="30" rx="15" fill="#2B2522"/>
    <circle cx="284" cy="507" r="9" fill="#4F8A5B"/><text x="284" y="511" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">P</text>
    <text x="300" y="511" font-size="11" fill="#F5F0E8">alex@home.example</text>
  </g>
  <g class="w3"><g transform="translate(460 200)" filter="url(#drop)"><use href="#win"/></g>
    <text x="610" y="224" font-size="12" font-weight="600" fill="#5C534B" text-anchor="middle">Claude — Side project</text>
    <rect x="476" y="532" width="268" height="30" rx="15" fill="#2B2522"/>
    <circle cx="494" cy="547" r="9" fill="#6B4E9B"/><text x="494" y="551" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">S</text>
    <text x="510" y="551" font-size="11" fill="#F5F0E8">alex@studio.example</text>
  </g>

  <!-- Porter's panel: every profile, running -->
  <g filter="url(#drop)"><rect x="830" y="44" width="330" height="430" rx="16" fill="#F5F0E8" stroke="#E7DDD1"/></g>
  <g transform="translate(846 58) scale(0.13)">
    <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#p-bg)"/>
    <g clip-path="url(#p-sq)"><path d="M40 256 V224 Q40 188 82 181 L111 177 H145 L174 181 Q216 188 216 224 V256 Z" fill="url(#p-uni)"/><path d="M111 177 L128 212 L145 177 Z" fill="#FFF4EA"/></g>
    <circle cx="128" cy="126" r="33" fill="#FFF4EA"/>
    <g transform="rotate(-8 128 98)"><path d="M102 84 Q102 72 114 72 H142 Q154 72 154 84 L157 104 H99 Z" fill="#433053"/><rect x="100" y="92" width="56" height="5" rx="2.5" fill="#E8B866"/><rect x="93" y="101" width="70" height="10" rx="5" fill="#2A1C33"/></g>
  </g>
  <text x="886" y="75" class="serif" font-size="18" font-weight="600" fill="#2B2522">Porter</text>
  <text x="886" y="90" font-size="10" font-weight="500" fill="#857A70">for Claude Desktop</text>
  <text x="848" y="124" font-size="10" font-weight="700" letter-spacing="0.8" fill="#857A70">RUNNING</text>

  <g class="r1">
    <rect x="844" y="134" width="302" height="88" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
    <circle class="beat" cx="862" cy="156" r="3.5" fill="#4F8A5B"/>
    <text x="874" y="161" class="serif" font-size="15" font-weight="600" fill="#2B2522">Work</text>
    <rect x="1050" y="146" width="84" height="20" rx="10" fill="#C2711F" fill-opacity="0.13"/><use href="#i-warn" x="1058.0" y="151.0" width="10" height="10" color="#C2711F"/><text x="1072.0" y="160" font-size="10" font-weight="700" fill="#C2711F">6 stopped</text>
    <text x="860" y="186" font-size="9" fill="#857A70">5h</text><rect x="878" y="181" width="208" height="4" rx="2" fill="#C2452D"/><text x="1130" y="186" font-size="9" font-weight="700" fill="#C2452D" text-anchor="end">100%</text>
    <text x="860" y="203" font-size="9" fill="#857A70">7d</text><rect x="878" y="198" width="208" height="4" rx="2" fill="#EDE4D8"/><rect x="878" y="198" width="191" height="4" rx="2" fill="#C2711F"/><text x="1130" y="203" font-size="9" font-weight="700" fill="#C2711F" text-anchor="end">92%</text>
  </g>
  <g class="r2">
    <rect x="844" y="232" width="302" height="88" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
    <circle class="beat" cx="862" cy="254" r="3.5" fill="#4F8A5B"/>
    <text x="874" y="259" class="serif" font-size="15" font-weight="600" fill="#2B2522">Personal</text>
    <text x="860" y="284" font-size="9" fill="#857A70">5h</text><rect x="878" y="279" width="208" height="4" rx="2" fill="#EDE4D8"/><rect x="878" y="279" width="17" height="4" rx="2" fill="#4F8A5B"/><text x="1130" y="284" font-size="9" font-weight="700" fill="#4F8A5B" text-anchor="end">8%</text>
    <text x="860" y="301" font-size="9" fill="#857A70">7d</text><rect x="878" y="296" width="208" height="4" rx="2" fill="#EDE4D8"/><rect x="878" y="296" width="44" height="4" rx="2" fill="#4F8A5B"/><text x="1130" y="301" font-size="9" font-weight="700" fill="#4F8A5B" text-anchor="end">21%</text>
  </g>
  <g class="r3">
    <rect x="844" y="330" width="302" height="88" rx="12" fill="#FFFDF9" stroke="#E7DDD1"/>
    <circle class="beat" cx="862" cy="352" r="3.5" fill="#4F8A5B"/>
    <text x="874" y="357" class="serif" font-size="15" font-weight="600" fill="#2B2522">Side project</text>
    <text x="860" y="382" font-size="9" fill="#857A70">5h</text><rect x="878" y="377" width="208" height="4" rx="2" fill="#EDE4D8"/><rect x="878" y="377" width="62" height="4" rx="2" fill="#4F8A5B"/><text x="1130" y="382" font-size="9" font-weight="700" fill="#4F8A5B" text-anchor="end">30%</text>
    <text x="860" y="399" font-size="9" fill="#857A70">7d</text><rect x="878" y="394" width="208" height="4" rx="2" fill="#EDE4D8"/><rect x="878" y="394" width="81" height="4" rx="2" fill="#C2711F"/><text x="1130" y="399" font-size="9" font-weight="700" fill="#4F8A5B" text-anchor="end">39%</text>
  </g>
  <rect x="831" y="430" width="328" height="1" fill="#E7DDD1"/>
  <use href="#i-plus" x="848.0" y="446.0" width="11" height="11" color="#C96442"/><text x="864.0" y="456" font-size="12" font-weight="600" fill="#C96442">New Profile…</text>

  <text x="995" y="530" font-size="15" fill="#E8DED3" text-anchor="middle">One Claude Desktop per account,</text>
  <text x="995" y="552" font-size="15" fill="#E8DED3" text-anchor="middle">all open at the same time.</text>
</svg>
